name: Publish HACS release

# Only an explicitly approved, hardware-tested build should become stable.
# Merging a version bump into main must never publish an untested release.
on:
  workflow_dispatch:
    inputs:
      hardware_tested:
        description: "Confirm that the OTA transfer and post-OTA firmware verification passed on physical hardware"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.hardware_tested == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("custom_components/atc_ota/manifest.json"))["version"])')"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
          fi
