name: Tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile custom integration
        run: python -m compileall -q custom_components/atc_ota

      - name: Run pure regression tests
        run: pytest -q tests/test_bthome.py tests/test_protocol.py tests/test_firmware_cache.py
