name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check
        run: python -m compileall -q atc_ota/app
      - name: Protocol tests
        run: |
          python -m pip install pytest -r atc_ota/requirements.txt
          pytest -q tests
