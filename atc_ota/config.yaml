name: "ATC OTA over ESPHome"
version: "0.1.10"
slug: "atc_ota"
description: "Inventory and update pvvx/ATC Telink thermometers through auto-discovered ESPHome Bluetooth Proxies"
url: "https://github.com/eugentib/home-assistant-atc-ota"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:thermometer-bluetooth
panel_title: ATC OTA
homeassistant_api: true
options:
  auto_discover_proxies: true
  proxy_address: "btproxy1.local."
  proxy_noise_psk: ""
  scan_seconds: 8
  publish_to_home_assistant: true
  catalog_refresh_hours: 6
  low_battery_warning_percent: 30
  debug: false
schema:
  auto_discover_proxies: bool
  proxy_address: str
  proxy_noise_psk: password
  scan_seconds: int(3,30)
  publish_to_home_assistant: bool
  catalog_refresh_hours: int(1,168)
  low_battery_warning_percent: int(1,100)
  debug: bool
